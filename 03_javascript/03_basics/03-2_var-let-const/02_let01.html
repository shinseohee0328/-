<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>let</title>
</head>
<body>
  <script>
    let num1 = 10; // 변수 선언과 동시에 값을 할당 -> 초기값 -> 초기화
    console.log(num1);
    num1 = 20;
    console.log(num1);
    num1 = '신서희';
    console.log(num1);
  </script>
</body>
</html>

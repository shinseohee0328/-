<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>변수</title>
</head>

<body>
  <script>
    var num1; //num1이라는 변수 선언
    console.log(num1);
    var num1 = 2;
    console.log(num1);
    num1 = '문자열'
    console.log(num1);

    let str1;
    console.log(str1);
    str1 = '신서희'
    document.write(str1);
    /*
    ecma6문법
    var는 동일한 변수를 중복해서 선언할 수 있지만
    let은 이미 선언한 변수를 중복해서 선언할 수 없다.
    var와 let은 앞으로 학습할 제어문이나 함수의 블록{}에서도 차이점이 있다.
    */
  </script>
</body>

</html>

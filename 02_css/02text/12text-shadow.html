<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text-shadow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Storm&display=swap');
    .ex {
      margin-top: 100px;
      border: 1px solid #ccc;
    }

    .s1 {
      font-size: 50px;
      text-shadow: 10px 10px 3px #f00; /* x축 y축 번짐정도 컬러 */
    }

    .s2 {
      font-size: 100px;
      color: orange;
      text-shadow: -2px -2px 10px blue;
    }

    .s3 {
      font-size: 200px;
      color:black;
      text-shadow: -30px -30px 10px silver;
      font-family: "Rubik Storm", system-ui;
      font-weight: 200;
    }
  </style>
</head>

<body>
  <h1>text-shadow 속성</h1>
  <p>텍스트에 그림자 효과를 추가하는 속성</p>
  <p>text-shadow : 가로거리 세로거리 번짐정도 색상</p>
  <div class="ex">
    <h2 class="s1">HTML5</h2>
    <h2 class="s2">HTML5</h2>
    <h2 class="s3">HTML5</h2>
    <h2 class="s4">HTML5</h2>
    <h2 class="s5">HTML5</h2>
  </div>
</body>

</html>

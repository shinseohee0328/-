<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>align-self</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      height: 100vh;
      flex-direction: column; /* 컬럼은 주축이 세로니까 교차축이 가로!! */
      justify-content: center; /* 주축정렬 */
      align-items: center; /* 교차축 정렬(세로) */
    }
    .flex_item:nth-child(2){
      align-self: auto;
      align-self: stretch;
      align-self: flex-start;
      align-self: flex-end;
      align-self: baseline;
      align-self: center;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">AAAAAAAAAAAAAAAAAAAAAAAAAA</div>
    <div class="flex_item">BBBBBBBBBBBBBBBB</div>
    <div class="flex_item">CCCCC</div>
</body>

</html>

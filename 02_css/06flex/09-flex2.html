<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      display: flex;
      flex-wrap: wrap;
      width: 1360px;
      margin: 0 auto;
    }
    .flex_item{
      flex: 1 1 auto;
    }
    .flex_item:nth-child(1){
      width: 30%;
    }
    .flex_item:nth-child(2){
      width: 60%;
    }
    .flex_item:nth-child(3){
      width: 20%;
    }
  </style>
</head>
<body>
  <div class="flex_container">
    <div class="flex_item">
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ratione maxime similique ab itaque voluptates nostrum. Aliquid autem, odio, reprehenderit, tempora quis tempore sed necessitatibus ipsa commodi expedita debitis aliquam? Maxime.</p>
    </div>
    <div class="flex_item">비비비</div>
    <div class="flex_item">씨씨씨씨씨씨씨</div>
  </div>
</body>
</html>

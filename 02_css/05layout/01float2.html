<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>float</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
h1,.container,/* h1 container p 같이 묶어서 스타일지정 */
p{
  width: 1280px;
  border: 1px solid #ccc;
  margin: 0 auto;
  box-sizing: border-box;
}
.container{
  overflow: hidden;
}
.container div{
  width: 150px;
  height: 50px;
  background: lightblue;
}
/* container 안에있는 left부르기 */
.container .left{
  float: left;
}
.container .right{
  float: right;
}
/* [float 무효화] */
/* 1. 내리고싶은 애한테 clear:both */
/* 2. 부모한테 overflow:hidden */
/* 3. css 가상요소 만들기
.clearfix::after{
content:' ';
display:block;
clear:both} */
  </style>
</head>
<body>
  <h1>clear 속성을 이용한 위치 조정</h1>
  <!-- 같은줄 = 같은레벨 -->
  <div class="container">
    <div class="left">왼쪽 끝에 위치하고 싶은 요소</div>
    <div class="right">오른쪽 끝에 위치하고 싶은 요소</div>
  </div>
  <p>이 글자를 아래쪽에 제대로 출력 하고 싶어요</p>
</body>
</html>

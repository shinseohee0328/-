<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ul ol 혼용</title>
</head>

<body>
  <!-- ol(orderlist : 순서있는 리스트 , ul(unorderlist : 순서없는 리스트) 안에는 <li>만 들어갈 수 있다 -->
  <h2>1박 2일 가족 여행 코스</h2>
  <ol>
    <li>1일차
      <ul>
        <li>해녀박물관</li>
        <li>낚시체험</li>
      </ul>
    </li>
    <li>2일차
      <ol start="3" reversed>
        <li>용눈이오름</li>
        <li>만장굴</li>
        <li>카약체험</li>
      </ol>
    </li>
  </ol>
</body>

</html>

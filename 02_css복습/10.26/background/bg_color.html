<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bg_color</title>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <h2>HEX CODE</h2>
       <ul class="ul1">
        <li>#ffffff처럼 #과 함께 6자리의 16진수로 표시</li>
        <li>앞에서부터 두자리씩 묶어 빨강, 초록, 파랑의 양</li>
        <li>하나도 섞이지 않았을때는 00, 가득 섞였을때는 ff로 표시</li>
        <li>#000000(검은색)~#ffffff(흰색)</li>
        <li>
          두자리씩 중복될 경우 줄여 사용할 수 있음<br>
          <b>#ffff00 - #ff0 , #cccccc - #ccc</b>
        </li>
      </ul>
    </div><!-- //.container -->

  </div>
</body>
</html>
